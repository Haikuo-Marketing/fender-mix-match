<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fender MIX & MATCH｜配色體驗</title><style>
:root{--bg:#f6f5f0;--ink:#141414;--red:#dd1c1c}*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif}.app{max-width:1900px;min-height:100vh;margin:auto;padding:18px 20px;display:grid;grid-template-columns:1.25fr 1fr;gap:4%}.visual{display:grid;grid-template-columns:70% 30%;gap:14px;min-height:min(90vh,840px)}.main-preview,.mini{background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.main-preview img{width:100%;height:100%;object-fit:contain}.mini-stack{display:grid;grid-template-rows:repeat(3,1fr);gap:14px}.mini img{width:90%;height:88%;object-fit:contain}.controls{padding:4px 2px 36px}.eyebrow{letter-spacing:5px;font-weight:700;font-size:17px;color:var(--red);margin:8px 0 22px}.headline{font-size:clamp(33px,4.05vw,70px);line-height:1.08;font-weight:900;letter-spacing:-2px;margin:0 0 26px}.subtitle{font-size:clamp(14px,1.35vw,23px);line-height:1.6;margin-bottom:36px;color:#373737}.group{padding:35px 0;border-top:1px solid #999}.group-title{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:16px;letter-spacing:.1px}.group-title strong{letter-spacing:3px;font-size:14px}.selected{font-weight:400;color:#494949}.swatches{display:flex;align-items:center;gap:18px;margin-top:23px}.swatch{width:53px;height:53px;border:1px solid #e3e2e1;border-radius:50%;cursor:pointer;position:relative;transition:transform .12s;background:var(--swatch)}.swatch:hover{transform:scale(1.08)}.swatch[aria-pressed=true]::after{content:"";position:absolute;inset:-6px;border:2px solid #151515;border-radius:50%}.footer{border-top:1px solid #bbb;padding:20px 0;font-size:12px;color:#656565;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.btn{background:#151515;color:#fff;padding:12px 16px;border:0;cursor:pointer;text-decoration:none;border-radius:3px;font-size:13px}.origin{font-size:12px;color:#626262;margin:14px 0}.code{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:1px}.status{color:#c62828}img{display:block}button{font:inherit}@media(max-width:1050px){.app{grid-template-columns:1fr;gap:22px}.visual{height:68vw;min-height:460px;max-height:710px}.controls{max-width:900px;padding:0 2px}.headline{font-size:clamp(34px,7vw,60px)}.group{padding:23px 0}}@media(max-width:580px){.app{padding:10px}.visual{height:67vw;min-height:280px;gap:7px}.mini-stack{gap:7px}.eyebrow{font-size:13px;margin-top:15px;letter-spacing:3px}.subtitle{font-size:15px;margin-bottom:20px}.group-title{font-size:13px}.group-title strong{font-size:12px;letter-spacing:1px}.swatches{gap:15px;margin-top:20px}.swatch{width:42px;height:42px}}
/* Keep mobile image tracks within the preview area. */
@media (max-width:1050px) {
  .app { grid-template-columns:minmax(0,1fr); }
  .visual { grid-template-columns:minmax(0,7fr) minmax(0,3fr); grid-template-rows:minmax(0,1fr); }
  .mini-stack { min-height:0; grid-template-rows:repeat(3,minmax(0,1fr)); }
}
</style></head><body><main class="app"><section class="visual"><div class="main-preview"><img id="mainImage" src="images/BBB.webp" alt="耳機搭配預覽"></div><div class="mini-stack"><div class="mini"><img id="bodyImage" src="images/body_B.webp" alt="耳機本體"></div><div class="mini"><img id="padImage" src="images/pad_B.webp" alt="耳墊"></div><div class="mini"><img id="headImage" src="images/band_B.webp" alt="頭帶"></div></div></section><section class="controls"><div class="eyebrow">MIX & MATCH</div><h1 class="headline">Your Colors. Your MIX.</h1><p class="subtitle">Customize your ear cushions and headband with our visualizer.<br>Headbands and cushions sold separately.</p><div id="groups"></div><div class="footer"><span>目前組合 <span class="code" id="combCode">BBB</span></span><a class="btn" id="downloadLink" href="images/BBB.webp" download="Fender_MIX_BBB.webp">下載目前配色</a><span id="sourceNote" class="origin">原廠組合圖</span></div></section></main><script>
const COLORS=[{code:'B',name:'Skyscraper Black',hex:'#000000'},{code:'W',name:'Olympic White',hex:'#fff'},{code:'S',name:'Surf Blue',hex:'#1c43b7'},{code:'L',name:'Misty Lavender',hex:'#d0c2e9'},{code:'P',name:'Sakura Pink',hex:'#ffc0cb'}];
const NATIVE=new Set('BBB,BBS,BLB,BLS,BPB,BPS,BSB,BWB,BWS,LBB,LBL,LBP,LBS,LBW,LLB,LPB,LSB,LWB,PBB,PLB,PPB,PSB,PWB,SBB,SBL,SBP,SBS,SBW,SLB,SLL,SLP,SLS,SLW,SPB,SPS,SSB,SSL,SSP,SSS,SSW,SWB,SWL,SWP,SWS,SWW,WBB,WLB,WPB,WSB,WWB'.split(','));let selections={body:'B',pad:'B',band:'B'};
const rows=[['body','SELECT MIX HEADPHONES','bodyImage'],['pad','SELECT EAR CUSHIONS','padImage'],['band','SELECT HEADBAND','headImage']];
const container=document.getElementById('groups');for(const [section,title] of rows){const wrapper=document.createElement('div');wrapper.className='group';wrapper.innerHTML=`<div class="group-title"><strong>${title} :</strong><span class="selected" id="label_${section}"></span></div><div class="swatches" id="swatches_${section}" role="group" aria-label="${title}"></div>`;container.appendChild(wrapper);const swatches=wrapper.querySelector('.swatches');for(const item of COLORS){const btn=document.createElement('button');btn.className='swatch';btn.type='button';btn.style.setProperty('--swatch',item.hex);btn.title=item.name;btn.setAttribute('aria-label',item.name);btn.dataset.color=item.code;btn.onclick=()=>{selections[section]=item.code;render()};swatches.appendChild(btn)}}
function render(){const code=selections.body+selections.pad+selections.band;const big=document.getElementById('mainImage');big.src='images/'+code+'.webp';big.alt=COLORS.find(x=>x.code===selections.body).name+' 機身、'+COLORS.find(x=>x.code===selections.pad).name+' 耳墊、'+COLORS.find(x=>x.code===selections.band).name+' 頭帶';for(const [type,,imgId] of rows){const current=COLORS.find(x=>x.code===selections[type]);document.getElementById('label_'+type).textContent=current.name;document.getElementById(imgId).src='images/'+type+'_'+current.code+'.webp';document.querySelectorAll('#swatches_'+type+' button').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.color===current.code)))}document.getElementById('combCode').textContent=code;const link=document.getElementById('downloadLink');link.href='images/'+code+'.webp';link.download='Fender_MIX_'+code+'.webp';document.getElementById('sourceNote').textContent=NATIVE.has(code)?'已提供的原廠完整組合圖':'由原廠素材合成的預覽圖'}
document.getElementById('mainImage').addEventListener('error',()=>document.getElementById('sourceNote').textContent='圖片讀取失敗，請確認 images 資料夾與 index.html 同層');render();
</script></body></html>
