const COLORS = [['black','Skyscraper Black','#000000'],['white','Olympic White','#ffffff'],['blue','Surf Blue','#2148b4'],['lavender','Misty Lavender','#cfc2e9'],['pink','Sakura Pink','#ffc0cb']];
const selected = {body:'pink',pad:'black',band:'black'};
const TYPES = [['body','SELECT MIX HEADPHONES'],['pad','SELECT EAR CUSHIONS'],['band','SELECT HEADBAND']];
const holder = document.getElementById('picks');
for(const [type,title] of TYPES){
  const div=document.createElement('div'); div.className='pick';
  div.innerHTML=`<h2>${title} : <span id="label-${type}"></span></h2><div class="swatches" id="swatches-${type}"></div>`;
  holder.appendChild(div);
  const sw=div.querySelector('.swatches');
  for(const [key,label,hex] of COLORS){
    const btn=document.createElement('button');btn.type='button';btn.style.background=hex;
    btn.title=label;btn.setAttribute('aria-label',`${title}: ${label}`);btn.dataset.key=key;
    btn.addEventListener('click',()=>{selected[type]=key;render()});sw.appendChild(btn);
  }
}
function render(){
  const key=`${selected.body}_${selected.pad}_${selected.band}`;
  const url=COMBINATIONS[key];
  if(!url){console.error('Missing combination',key);return}
  // A single pre-rendered image is used for every combination, avoiding mismatched masks.
  document.getElementById('result').src=url;
  for(const [type] of TYPES){
    const value=COLORS.find(x=>x[0]===selected[type]);
    document.getElementById('label-'+type).textContent=value[1];
    document.getElementById(type+'Prev').src=THUMBS[type][selected[type]];
    document.querySelectorAll('#swatches-'+type+' button').forEach(btn=>{
      btn.classList.toggle('selected',btn.dataset.key===selected[type]);
      btn.setAttribute('aria-pressed',String(btn.dataset.key===selected[type]));
    });
  }
  document.getElementById('counter').textContent='125 UNIQUE COLOR COMBINATIONS · '+[selected.body,selected.pad,selected.band].join(' / ').toUpperCase();
}

document.getElementById('save').addEventListener('click',()=>{const a=document.createElement('a');a.download=`Fender-MIX-${selected.body}-${selected.pad}-${selected.band}.webp`;a.href=COMBINATIONS[[selected.body,selected.pad,selected.band].join('_')];document.body.appendChild(a);a.click();a.remove()});
render();
